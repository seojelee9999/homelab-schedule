spring.application.name=schedule
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:schedule_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
spring.jackson.time-zone=Asia/Seoul
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
schedule.discord-webhook-url=${DISCORD_WEBHOOK_URL:}
schedule.worker-enabled=${WORKER_ENABLED:true}
schedule.poll-ms=5000
schedule.claim-timeout-seconds=60
