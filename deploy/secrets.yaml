apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schedule-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: schedule-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /homelab/schedule/DB_PASSWORD
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: /homelab/schedule/DISCORD_WEBHOOK_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schedule-postgres-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: schedule-postgres-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_ADMIN_PASSWORD
      remoteRef:
        key: /homelab/schedule/POSTGRES_ADMIN_PASSWORD
