apiVersion: v1
kind: Service
metadata:
  name: schedule
spec:
  selector:
    app: schedule
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule
spec:
  replicas: 2
  selector:
    matchLabels:
      app: schedule
  template:
    metadata:
      labels:
        app: schedule
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: schedule
          image: ghcr.io/seojelee9999/homelab-schedule
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Asia/Seoul
            - name: SERVER_SERVLET_SESSION_COOKIE_NAME
              value: DAYSESSION
            - name: SERVER_SERVLET_SESSION_COOKIE_PATH
              value: /plan
            - name: SERVER_SERVLET_SESSION_COOKIE_SECURE
              value: "true"
            - name: SERVER_SERVLET_SESSION_COOKIE_SAMESITE
              value: lax
            - name: DB_URL
              value: jdbc:postgresql://schedule-postgres:5432/schedule
            - name: DB_USERNAME
              value: schedule_app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: schedule-app
                  key: DB_PASSWORD
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: schedule-app
                  key: DISCORD_WEBHOOK_URL
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
