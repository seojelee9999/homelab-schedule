apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: schedule
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tunnel-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - akibaha.shop
  rules:
    - matches:
        - path:
            type: Exact
            value: /plan
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            path:
              type: ReplaceFullPath
              replaceFullPath: /plan/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /plan
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: schedule
          port: 8080
          weight: 1
